name: Deploy Backend Service

on:
  push:
    branches: [prod]
    paths:
      - 'backend-service/**'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: backend-service/.venv
          key: venv-backend-${{ hashFiles('backend-service/requirements.txt') }}

      - name: Create .venv and install
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: backend-service
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Ruff check
        working-directory: backend-service
        run: |
          source .venv/bin/activate
          ruff check backend-service/

      - name: Import smoke test
        working-directory: backend-service/backend-service
        run: |
          source ../.venv/bin/activate
          python -c "
          from pathlib import Path
          from app.core.config import settings
          settings.upload_dir.mkdir(parents=True, exist_ok=True)
          from app.main import app
          assert app.title
          "

      - name: Run tests
        working-directory: backend-service/backend-service
        run: |
          source ../.venv/bin/activate
          pytest tests/ -v --tb=short

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/935440412003/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider
          service_account: retinaxai-runner@project-b1ee996a-986e-4b50-bea.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push with layer cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend-service/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/retinaxai/backend-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend-service
          image: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/retinaxai/backend-service:${{ github.sha }}
          region: us-central1
          flags: >-
            --service-account=retinaxai-runner@project-b1ee996a-986e-4b50-bea.iam.gserviceaccount.com
            --vpc-connector=projects/${{ vars.GCP_PROJECT_ID }}/locations/us-central1/connectors/retinaxai-vpc
            --allow-unauthenticated
            --cpu=2
            --memory=4Gi
            --min-instances=0
            --max-instances=3
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
            LLM_SERVICE_URL=${{ secrets.LLM_SERVICE_URL }}
            ML_SERVICE_API_KEY=${{ secrets.ML_SERVICE_API_KEY }}
            LLM_SERVICE_API_KEY=${{ secrets.LLM_SERVICE_API_KEY }}
            GCS_BUCKET_UPLOADS=retinaxai-uploads

      - name: Update CORS origins (avoids ^,^ delimiter collision with comma in JSON)
        run: >-
          gcloud run services update backend-service
          --region us-central1
          --update-env-vars
          "^|^CORS_ORIGINS=[\"https://retinaxai.me\",\"https://www.retinaxai.me\",\"https://retina-xai.vercel.app\"]"
