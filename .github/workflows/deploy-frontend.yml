name: Deploy Frontend Service

on:
  push:
    branches: [prod]
    paths:
      - 'frontend-service/**'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend-service
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend-service
        run: bun run lint

      - name: Type-check
        working-directory: frontend-service
        run: bunx tsc --noEmit

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend-service
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel
        working-directory: frontend-service
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          bunx vercel build --prod --token=$VERCEL_TOKEN --build-env NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
