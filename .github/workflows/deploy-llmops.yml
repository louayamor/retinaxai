name: Deploy LLMOps Service

on:
  push:
    branches: [prod]
    paths:
      - 'llmops-service/**'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: llmops-service/.venv
          key: venv-llmops-${{ hashFiles('llmops-service/requirements.txt') }}

      - name: Create .venv and install
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: llmops-service
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Ruff check
        working-directory: llmops-service
        run: |
          source .venv/bin/activate
          ruff check llmops-service/

      - name: Import smoke test
        working-directory: llmops-service/llmops-service
        run: |
          source ../.venv/bin/activate
          python -c "from app.main import app; assert app.title"

      - name: Run tests
        working-directory: llmops-service/llmops-service
        run: |
          source ../.venv/bin/activate
          pytest tests/ -v --tb=short

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/935440412003/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider
          service_account: retinaxai-runner@project-b1ee996a-986e-4b50-bea.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push with layer cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: llmops-service/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/retinaxai/llmops-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: llmops-service
          image: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/retinaxai/llmops-service:${{ github.sha }}
          region: us-central1
          flags: >-
            --service-account=retinaxai-runner@project-b1ee996a-986e-4b50-bea.iam.gserviceaccount.com
            --vpc-connector=projects/${{ vars.GCP_PROJECT_ID }}/locations/us-central1/connectors/retinaxai-vpc
            --no-allow-unauthenticated
            --cpu=2
            --memory=4Gi
            --min-instances=0
            --max-instances=3
          env_vars: |
            CHROMA_HOST=10.128.0.2
            CHROMA_PORT=8000
            RAG_EMBEDDINGS_OFFLINE=true
            MLOPS_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
            LLMOPS_API_KEY=${{ secrets.LLMOPS_API_KEY }}
            BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}
            GH_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
