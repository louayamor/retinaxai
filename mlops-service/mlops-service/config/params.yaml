# ── Global ────────────────────────────────────────────────────────────────────

global:
  seed: 42
  num_classes: 5
  image_size: 300
  device: cuda

# ── Data ──────────────────────────────────────────────────────────────────────

data:
  ratios:
    clinical: 0.15
    eyepacs: 0.85
    oversample_ratio: 12
  keep_no_dr_ratio: 0.30

# ── Augmentation ──────────────────────────────────────────────────────────────

augmentation:
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation: 20

  color_jitter:
    brightness: 0.35
    contrast: 0.35
    saturation: 0.15
    hue: 0.08

  gaussian_blur:
    enabled: true
    kernel_size: 3
    sigma: [0.1, 1.5]

  clahe:
    enabled: false   # CLAHE applied in preprocessing (data_transformation.py)

  random_erasing:
    enabled: true
    probability: 0.15

  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  mixup:
    enabled: false
    alpha: 0.2

  domain_robustness:
    random_grayscale_prob: 0.15
    random_sharpness: 0.7
    random_affine_translate: [0.08, 0.08]
    random_affine_scale: [0.85, 1.15]
    gaussian_noise_std: 0.02

    jpeg_compression:
      enabled: true
      quality_range: [60, 100]

    illumination_shift:
      enabled: true
      gamma_range: [0.7, 1.5]

# ── Training ──────────────────────────────────────────────────────────────────

training:
  class_weights: [1.0, 6.0, 3.0, 8.0, 10.0]
  weighted_sampling: true
  use_class_weights_in_loss: true
  early_stopping_metric: macro_f1
  early_stopping_patience: 4
  early_stopping_min_delta: 0.004
  label_smoothing: 0.05
  weight_decay: 0.002
  scheduler: cosine
  lr_warmup_epochs: 3
  batch_size: 8
  num_workers: 4
  pin_memory: true
  gradient_accumulation_steps: 4
  gradient_clip_norm: 1.0
  monitor_per_class_metrics: true
  save_confusion_matrix: true
  save_misclassified_images: true

  phase1:
    epochs: 18
    lr: 0.00004
    dropout: 0.40
    freeze_backbone: true
    freeze_blocks: 3
    unfreeze_last_blocks: 1
    focal_loss_gamma: 2.0
    loss: focal_ordinal_weighted

  phase2:
    epochs: 15
    lr: 0.00001
    backbone_lr_ratio: 5
    dropout: 0.30
    freeze_backbone: false
    focal_loss_gamma: 2.2
    loss: focal_ordinal_weighted
    early_stopping_patience: 4
    mixup:
      enabled: true
      alpha: 0.25
    fda:
      enabled: true
      beta: 0.08
      probability: 0.5

# ── FDA (Fourier Domain Adaptation) ───────────────────────────────────────────

fda:
  inference_beta: 0.08
  target_images_dir: artifacts/data/processed/imaging/images/samaya
  cache_path: artifacts/data/processed/imaging/samaya_amplitude_target.pt

# ── TENT (Test-Time Entropy Minimization) ─────────────────────────────────────

tent:
  enabled: false
  learning_rate: 0.00005
  steps: 1
  momentum: 0.9

# ── XGBoost (ML branch) ───────────────────────────────────────────────────────

ml_training:
  model: xgboost
  seed: 42
  test_size: 0.2
  target: clinical_npdr_grade
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.5
    reg_lambda: 2.0
    eval_metric: mlogloss
  features:
    numeric:
      - thickness_center_fovea
      - thickness_average_thickness
      - thickness_total_volume_mm3
      - thickness_inner_superior
      - thickness_inner_nasal
      - thickness_inner_inferior
      - thickness_inner_temporal
      - thickness_outer_superior
      - thickness_outer_nasal
      - thickness_outer_inferior
      - thickness_outer_temporal
      - patient_age
    categorical:
      - patient_gender
      - meta_eye
      - clinical_edema
      - clinical_erm_status
      - meta_image_quality

# ── Inference ─────────────────────────────────────────────────────────────────

inference:
  confidence_threshold: 0.40
  apply_fda_inverse: false
  tta:
    enabled: true
    horizontal_flip: true
    rotation_angles: [-10, 0, 10]
    brightness_shift: [0.95, 1.05]

# ── Evaluation ────────────────────────────────────────────────────────────────

evaluation:
  dl:
    batch_size: 8
    num_workers: 4
    metrics:
      - accuracy
      - macro_f1
      - precision_macro
      - recall_macro
      - quadratic_weighted_kappa
      - roc_auc
      - classification_report
      - confusion_matrix
      - per_class_recall
      - per_class_precision
  ml:
    metrics:
      - accuracy
      - quadratic_weighted_kappa
      - roc_auc
      - f1_weighted
      - classification_report
  domain_shift:
    compute_embedding_mmd: true
    compute_confidence_ece: true
    compute_feature_psi: true

# ── MLflow ────────────────────────────────────────────────────────────────────

mlflow:
  imaging_run_name: efficientnet_b3_domain_robust
  model_log_timeout_seconds: 600
  log_confusion_matrix: true
  log_misclassified_samples: true
  log_per_class_metrics: true

# ── Fundus Classifier ─────────────────────────────────────────────────────────

fundus_classifier:
  model_name: mobilenetv3_small_100
  threshold: 0.3
  num_classes: 2
  dropout: 0.15
