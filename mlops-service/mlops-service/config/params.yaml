# ── Global ────────────────────────────────────────────────────────────────────
#
# Evaluation Metrics (priority order)
#   1. QWK          — Main leaderboard / clinical ordinal agreement
#   2. Macro F1      — Class balance evaluation
#   3. Recall G3/G4  — Clinical safety (severe DR must not be missed)
#   4. AUC           — Representation quality
#   5. MAE           — Secondary ordinal error
#   6. RMSE          — Catastrophic grading penalty (quadratic)
# ───────────────────────────────────────────────────────────────────────────────

global:
  seed: 42
  num_classes: 5
  image_size: 384
  device: cuda

# ── Data ──────────────────────────────────────────────────────────────────────

data:
  ratios:
    clinical: 0.12   
    eyepacs: 0.88
    oversample_ratio: 10
  keep_no_dr_ratio: 0.35   # G0:DR ratio drops 3.4:1→1.5:1

# ── Augmentation ──────────────────────────────────────────────────────────────

augmentation:
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.05
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  mixup:
    enabled: false
    alpha: 0.2
  domain_robustness:
    random_grayscale_prob: 0.1
    random_sharpness: 0.5
    random_affine_translate: [0.05, 0.05]
    random_affine_scale: [0.90, 1.10]

# ── Training ──────────────────────────────────────────────────────────────────

training:
  sampler_weight_cap: 5.0
  class_weights: [0.5, 4.0, 1.5, 7.0, 9.0]
  weighted_sampling: true
  use_class_weights_in_loss: true
  early_stopping_metric: qwk
  early_stopping_patience: 10
  label_smoothing: 0.15
  weight_decay: 0.001
  scheduler: cosine
  lr_warmup_epochs: 3
  batch_size: 8
  num_workers: 8
  pin_memory: true
  gradient_accumulation_steps: 18

  phase1:
    epochs: 20
    lr: 0.0002
    backbone_lr_ratio: 1.0
    dropout: 0.45
    freeze_backbone: false
    freeze_blocks: 0
    unfreeze_last_blocks: false
    focal_loss_gamma: 1.5
    loss: focal_ordinal_weighted

  phase2:
    skip: true
    epochs: 20
    lr: 0.00001
    backbone_lr_ratio: 1.0
    dropout: 0.3
    freeze_backbone: false
    focal_loss_gamma: 2.5
    loss: focal_ordinal_weighted
    early_stopping_patience: 8
    mixup:
      enabled: false
    fda:
      enabled: false

# ── FDA (Fourier Domain Adaptation) ───────────────────────────────────────────

fda:
  enabled: false
  beta: 0.15
  probability: 0.5
  inference_beta: 0.1
  target_images_dir: artifacts/data/processed/imaging/images/samaya
  cache_path: artifacts/data/processed/imaging/samaya_amplitude_target.pt

# ── TENT (Test-Time Entropy Minimization) ─────────────────────────────────────

tent:
  enabled: true
  learning_rate: 0.0001
  steps: 3
  momentum: 0.9

# ── Inference ─────────────────────────────────────────────────────────────────

inference:
  confidence_threshold: 0.35
  apply_fda_inverse: false

# ── Evaluation ────────────────────────────────────────────────────────────────

evaluation:
  dl:
    batch_size: 16
    num_workers: 8
    metrics:
      - accuracy
      - quadratic_weighted_kappa
      - roc_auc
      - classification_report
  domain_shift:
    compute_embedding_mmd: true
    compute_confidence_ece: true

# ── MLflow ────────────────────────────────────────────────────────────────────

mlflow:
  imaging_run_name: efficientnet_b3
  model_log_timeout_seconds: 600

# ── Lesion Detection ──────────────────────────────────────────────────────────

lesion_model:
  enabled: true
  encoder_name: timm-efficientnet-b3
  encoder_weights: null
  decoder: UNet
  classes:
    - ma
    - he
    - ex
    - se
  thresholds:
    ma: 0.3
    he: 0.4
    ex: 0.4
    se: 0.35
  image_size: 384
  batch_size: 8
  num_workers: 4
  lr: 0.0001
  epochs: 100
  patience: 15
  ddr_hf_repo: ctmedtech/DDR-dataset
  ddr_target_dir: data/lesions/ddr
  checkpoint_path: artifacts/model/lesion/model.pth
  grader_checkpoint: artifacts/model/imaging/model.pth

# ── Fundus Classifier ─────────────────────────────────────────────────────────

fundus_classifier:
  model_name: mobilenetv3_small_100
  image_size: 384
  num_classes: 2
  threshold: 0.3
  dropout: 0.1
  batch_size: 32
  num_epochs: 5
  learning_rate: 0.001
