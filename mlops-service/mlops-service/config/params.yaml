# ── Global ────────────────────────────────────────────────────────────────────

global:
  seed: 42
  num_classes: 5
  image_size: 300
  device: cuda

# ── Data ──────────────────────────────────────────────────────────────────────

data:
  ratios:
    clinical: 0.12   # achievable: 90 Samaya × 10 oversample = 900 samples
    eyepacs: 0.88
    oversample_ratio: 10
  keep_no_dr_ratio: 0.35   # G0:DR ratio drops 3.4:1→1.5:1

# ── Augmentation ──────────────────────────────────────────────────────────────

augmentation:
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.05
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  mixup:
    enabled: false
    alpha: 0.2
  domain_robustness:
    random_grayscale_prob: 0.1
    random_sharpness: 0.5
    random_affine_translate: [0.05, 0.05]
    random_affine_scale: [0.90, 1.10]

# ── Training ──────────────────────────────────────────────────────────────────

training:
  class_weights: [1.0, 7.0, 3.5, 9.0, 11.0]   # G0=73.5%→1.0  G1=6.9%→7.0  G2=15.1%→3.5  G3=2.5%→9.0  G4=2.0%→11.0
  weighted_sampling: true
  use_class_weights_in_loss: true
  early_stopping_metric: macro_f1
  early_stopping_patience: 8
  label_smoothing: 0.1
  weight_decay: 0.001
  scheduler: cosine
  lr_warmup_epochs: 2
  batch_size: 8
  num_workers: 4
  pin_memory: true
  gradient_accumulation_steps: 4

  phase1:
    epochs: 10
    lr: 0.00005
    dropout: 0.45
    freeze_backbone: true
    freeze_blocks: 3
    unfreeze_last_blocks: true
    focal_loss_gamma: 2.0
    loss: focal_ordinal_weighted

  phase2:
    epochs: 10
    lr: 0.000005
    backbone_lr_ratio: 3
    dropout: 0.3
    freeze_backbone: false
    focal_loss_gamma: 2.5
    loss: focal_ordinal_weighted
    early_stopping_patience: 5
    mixup:
      enabled: true
      alpha: 0.2
    fda:
      enabled: true
      beta: 0.10   # G0 domain gap 47pp (73.5%→25.6%)
      probability: 0.3

# ── FDA (Fourier Domain Adaptation) ───────────────────────────────────────────

fda:
  inference_beta: 0.1
  target_images_dir: artifacts/data/processed/imaging/images/samaya
  cache_path: artifacts/data/processed/imaging/samaya_amplitude_target.pt

# ── TENT (Test-Time Entropy Minimization) ─────────────────────────────────────

tent:
  enabled: true
  learning_rate: 0.0001
  steps: 3
  momentum: 0.9

# ── XGBoost (ML branch) ───────────────────────────────────────────────────────

ml_training:
  model: xgboost
  seed: 42
  test_size: 0.2
  target: clinical_npdr_grade
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: mlogloss
  features:
    numeric:
      - thickness_center_fovea
      - thickness_average_thickness
      - thickness_total_volume_mm3
      - thickness_inner_superior
      - thickness_inner_nasal
      - thickness_inner_inferior
      - thickness_inner_temporal
      - thickness_outer_superior
      - thickness_outer_nasal
      - thickness_outer_inferior
      - thickness_outer_temporal
      - patient_age
    categorical:
      - patient_gender
      - meta_eye
      - clinical_edema
      - clinical_erm_status
      - meta_image_quality

# ── Inference ─────────────────────────────────────────────────────────────────

inference:
  confidence_threshold: 0.35
  apply_fda_inverse: false

# ── Evaluation ────────────────────────────────────────────────────────────────

evaluation:
  dl:
    batch_size: 8
    num_workers: 4
    metrics:
      - accuracy
      - quadratic_weighted_kappa
      - roc_auc
      - classification_report
  ml:
    metrics:
      - accuracy
      - quadratic_weighted_kappa
      - roc_auc
      - f1_weighted
      - classification_report
  domain_shift:
    compute_embedding_mmd: true
    compute_confidence_ece: true

# ── MLflow ────────────────────────────────────────────────────────────────────

mlflow:
  imaging_run_name: efficientnet_b3
  model_log_timeout_seconds: 600

# ── Fundus Classifier ─────────────────────────────────────────────────────────

fundus_classifier:
  model_name: mobilenetv3_small_100
  threshold: 0.3
  num_classes: 2
  dropout: 0.1