data_ingestion:
  huggingface:
    dataset_name: bumbledeep/eyepacs
    train_split: train
  samaya:
    images_dir: artifacts/ocr/output/images
    reports_csv: artifacts/ocr/output/reports.csv
    reports_json: artifacts/ocr/output/reports.json

imaging_model:
  model_name: efficientnet_b3
  pretrained: true

monitoring:
  prometheus_port: 9090

mlflow:
  experiment_name: retinaxai-dr-classification
  imaging_run_name: efficientnet_b3

inter_service:
  llmops_url: ${LLMOPS_SERVICE_URL}
  timeout_seconds: 30

ocr_pipeline:
  input_dir: data/ocr_reports
  output_dir: artifacts/ocr/output
  json_output: artifacts/ocr/output/reports.json
  csv_output: artifacts/ocr/output/reports.csv
  images_dir: artifacts/ocr/output/images
  regions_config: config/regions.yaml