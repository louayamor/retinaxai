stages:
  imaging_ingestion:
    cmd: python main.py pipeline --stage ingest --pipeline imaging
    deps:
      - main.py
      - app/domains/imaging/pipeline/stage_01_data_ingestion.py
      - app/domains/imaging/components/data_ingestion.py
      - app/config/configuration.py
      - app/entity/config_entity.py
      - config/config.yaml
    outs:
      - artifacts/data/raw/huggingface/train

  imaging_cleaning:
    cmd: python main.py pipeline --stage clean --pipeline imaging
    deps:
      - main.py
      - app/domains/imaging/pipeline/stage_02_data_cleaning.py
      - app/domains/imaging/components/data_cleaning.py
      - app/config/configuration.py
      - config/config.yaml
      - artifacts/data/raw/huggingface/train
    outs:
      - artifacts/data/raw/huggingface/train_clean

  imaging_transformation:
    cmd: python main.py pipeline --stage transform --pipeline imaging
    deps:
      - main.py
      - app/domains/imaging/pipeline/stage_03_data_transformation.py
      - app/domains/imaging/components/data_transformation.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - config/schema.yaml
      - artifacts/data/raw/huggingface/train_clean
      - artifacts/ocr/output/reports.csv
    outs:
      - artifacts/data/processed/imaging/train.csv
      - artifacts/data/processed/imaging/test.csv
      - artifacts/data/processed/imaging/samaya.csv
      - artifacts/data/processed/imaging/images

  imaging_training:
    cmd: python main.py pipeline --stage train --pipeline imaging
    deps:
      - main.py
      - app/domains/imaging/pipeline/stage_04_model_trainer.py
      - app/domains/imaging/components/model_trainer.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/data/processed/imaging/train.csv
      - artifacts/data/processed/imaging/test.csv
    outs:
      - artifacts/model/imaging/model.pth

  imaging_evaluation:
    cmd: python main.py pipeline --stage evaluate --pipeline imaging
    deps:
      - main.py
      - app/domains/imaging/pipeline/stage_05_model_evaluation.py
      - app/domains/imaging/evaluation/imaging_evaluation.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/model/imaging/model.pth
      - artifacts/data/processed/imaging/test.csv
      - artifacts/data/processed/imaging/samaya.csv
    metrics:
      - artifacts/model/imaging/metrics.json:
          cache: false

  clinical_ingestion:
    cmd: python main.py pipeline --stage ingest --pipeline clinical
    deps:
      - main.py
      - app/domains/clinical/pipeline/stage_01_data_ingestion.py
      - app/domains/clinical/components/data_ingestion.py
      - app/config/configuration.py
      - config/config.yaml
      - artifacts/ocr/output/reports.csv
    outs:
      - artifacts/data/processed/clinical/raw.csv

  clinical_cleaning:
    cmd: python main.py pipeline --stage clean --pipeline clinical
    deps:
      - main.py
      - app/domains/clinical/pipeline/stage_02_data_cleaning.py
      - app/domains/clinical/components/data_cleaning.py
      - app/config/configuration.py
      - config/config.yaml
      - config/schema.yaml
      - artifacts/data/processed/clinical/raw.csv
    outs:
      - artifacts/data/processed/clinical/cleaned.csv

  clinical_transformation:
    cmd: python main.py pipeline --stage transform --pipeline clinical
    deps:
      - main.py
      - app/domains/clinical/pipeline/stage_03_data_transformation.py
      - app/domains/clinical/components/data_transformation.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - config/schema.yaml
      - artifacts/data/processed/clinical/cleaned.csv
    outs:
      - artifacts/data/processed/clinical/train.csv
      - artifacts/data/processed/clinical/test.csv
      - artifacts/data/processed/clinical/features.json

  clinical_training:
    cmd: python main.py pipeline --stage train --pipeline clinical
    deps:
      - main.py
      - app/domains/clinical/pipeline/stage_04_model_trainer.py
      - app/domains/clinical/components/model_trainer.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/data/processed/clinical/train.csv
      - artifacts/data/processed/clinical/features.json
    outs:
      - artifacts/model/clinical/model.pkl
      - artifacts/model/clinical/feature_importance.json

  clinical_evaluation:
    cmd: python main.py pipeline --stage evaluate --pipeline clinical
    deps:
      - main.py
      - app/domains/clinical/pipeline/stage_05_model_evaluation.py
      - app/domains/clinical/evaluation/clinical_evaluation.py
      - app/config/configuration.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/model/clinical/model.pkl
      - artifacts/data/processed/clinical/test.csv
    metrics:
      - artifacts/model/clinical/metrics.json:
          cache: false