# Alert rules for RetinaXAI ML monitoring
groups:
  - name: retinaxai-alerts
    interval: 30s
    rules:
      # High inference latency
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(retinaxai_inference_latency_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "High inference latency detected"
          description: "P95 inference latency is {{ $value }}s (threshold: 2.0s)"
          remediation: "Check model serving performance and GPU utilization"

      # Model drift detection
      - alert: ModelDriftDetected
        expr: max by (pipeline) (retinaxai_drift_psi_score) > 0.3
        for: 1h
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Data drift detected in {{ $labels.pipeline }} pipeline"
          description: "Drift score is {{ $value }} (threshold: 0.3)"
          remediation: "Review data quality, consider retraining model"

      # Model performance degradation
      - alert: ModelAccuracyDrop
        expr: retinaxai_best_val_accuracy < 0.5
        for: 24h
        labels:
          severity: critical
          service: mlops
        annotations:
          summary: "Model accuracy critically low"
          description: "{{ $labels.pipeline }} accuracy = {{ $value }} (threshold: 0.5)"
          remediation: "Investigate data drift, review recent training runs"

      # High training error rate
      - alert: HighTrainingErrorRate
        expr: rate(retinaxai_training_failures_total[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
          service: mlops
        annotations:
          summary: "High training error rate"
          description: "Training failure rate is {{ $value }} > 5% threshold"
          remediation: "Check training logs and pipeline health"

      # OOM kills
      - alert: ModelOOMKills
        expr: increase(retinaxai_inference_oom_kills[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Model OOM kill detected"
          description: "Model out-of-memory kill occurred"
          remediation: "Reduce batch size or increase memory allocation"

      # Automation scheduler stopped
      - alert: AutomationSchedulerStopped
        expr: retinaxai_automation_scheduler_running < 1
        for: 10m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Automation scheduler is not running"
          description: "Scheduler has been inactive for more than 10 minutes"
          remediation: "Check automation settings and service health"

      # High active training jobs
      - alert: HighTrainingLoad
        expr: retinaxai_active_training_jobs > 5
        for: 10m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "High training job concurrency"
          description: "{{ $value }} training jobs running simultaneously"
          remediation: "Review resource utilization, consider scaling"

      # High training rejection rate
      - alert: TrainingRejectionRateHigh
        expr: rate(retinaxai_training_rejections_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "High training rejection rate"
          description: "Training rejections above 0.1/sec in last 5 minutes"
          remediation: "Increase capacity or reduce training frequency"

      # Feature drift
      - alert: FeatureDrift
        expr: retinaxai_drift_psi_score{feature=~".+"} > 0.2
        for: 30m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Feature drift detected for {{ $labels.feature }}"
          description: "Drift score: {{ $value }}"
          remediation: "Review feature distribution, consider retraining"

      # No production model
      - alert: NoProductionModel
        expr: sum by (pipeline) (retinaxai_model_registry_versions{stage="production"}) < 1
        for: 10m
        labels:
          severity: critical
          service: mlops
        annotations:
          summary: "No production model for {{ $labels.pipeline }}"
          description: "{{ $labels.pipeline }} has zero production models"
          remediation: "Promote a staging model to production or run training"

      # Too many staging models
      - alert: TooManyStagingModels
        expr: retinaxai_model_registry_versions{stage="staging"} > 5
        for: 1h
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Excessive staging models accumulating"
          description: "{{ $labels.pipeline }} has {{ $value }} staging models"
          remediation: "Review and promote top candidates, archive rest"

      # Evidently dataset shift
      - alert: EvidentlyDatasetShift
        expr: retinaxai_evidently_dataset_shift > 0.5
        for: 1h
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "Evidently dataset shift detected in {{ $labels.pipeline }}"
          description: "Evidently drift score = {{ $value }} (threshold: 0.5)"
          remediation: "Review drift report HTML, consider retraining"

      # Evidently features drifted
      - alert: EvidentlyFeaturesDrifted
        expr: retinaxai_evidently_features_drifted > 3
        for: 30m
        labels:
          severity: warning
          service: mlops
        annotations:
          summary: "{{ $value }} features showing drift per Evidently ({{ $labels.pipeline }})"
          description: "Number of drifted features exceeds threshold of 3"
          remediation: "Check per-feature drift in Evidently report"
